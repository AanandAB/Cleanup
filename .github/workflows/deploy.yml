name: Deploy to Cloudflare Workers

# Auto-deploys on every push to main. Only runs when the repo has the
# Cloudflare secrets configured — in the AMC phase the deploy is done
# manually (`npm run deploy`), so this workflow stays idle (skipped) until
# the repo is migrated to the client and they add the secrets.
on:
  push:
    branches: [main]

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Idempotent — applies any new D1 schema migrations (no-op if none).
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cleanup-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build & deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
